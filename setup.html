<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BRIDAL PAVILION — Cloud Setup</title><style>body{font-family:system-ui,sans-serif;background:#faf8f5;color:#292524;margin:0;padding:24px}.card{max-width:560px;margin:4vh auto;background:white;padding:28px;border:1px solid #e7ddd4;border-radius:22px;box-shadow:0 10px 35px #0001}label{display:block;font-size:13px;font-weight:700;margin:16px 0 6px}input,button{box-sizing:border-box;width:100%;padding:13px;border-radius:10px;border:1px solid #ddd;margin-bottom:8px}button{background:#4d1426;color:white;font-weight:700;cursor:pointer}#msg{white-space:pre-wrap;font-size:14px;margin-top:12px}</style></head><body><div class="card"><h1>BRIDAL PAVILION</h1><h2>প্রথমবার Cloud Database Setup</h2><p>এই পেজে আপনার বর্তমান Studio JSON Backup একবার Cloudflare D1-তে import করুন। Cloud data তৈরি হয়ে গেলে নিরাপত্তার জন্য এই পেজ আর overwrite করতে দেবে না।</p><form id="f"><label>Studio Password</label><input id="pw" type="password" required autocomplete="current-password"><label>BRIDAL PAVILION JSON Backup</label><input id="file" type="file" accept="application/json,.json" required><button id="go">Backup Import করুন</button></form><div id="msg"></div><p><a href="/">Studio App খুলুন</a></p></div><script>const msg=document.getElementById('msg');document.getElementById('f').addEventListener('submit',async e=>{e.preventDefault();const b=document.getElementById('go');b.disabled=true;b.textContent='Import হচ্ছে...';try{const backup=JSON.parse(await document.getElementById('file').files[0].text());const login=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:document.getElementById('pw').value})});const l=await login.json();if(!login.ok)throw Error(l.error||'Login failed');localStorage.setItem('bp_cloudflare_session_v1',l.token);const res=await fetch('/api/import',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+l.token},body:JSON.stringify({backup})});const d=await res.json();if(!res.ok)throw Error(d.error||'Import failed');localStorage.setItem('bp_cloudflare_revision_v1','1');msg.textContent=`Import সফল! Invoice/Booking: ${d.invoiceCount}, Freelance Job: ${d.freelanceCount}\nএখন Studio App খুলুন।`;msg.style.color='green';}catch(err){msg.textContent='সমস্যা: '+err.message;msg.style.color='darkred';}finally{b.disabled=false;b.textContent='Backup Import করুন';}});</script></body></html>
